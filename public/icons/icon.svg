<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="256" cy="300" r="120" fill="url(#sun)"/>
    <rect y="300" width="512" height="212" fill="#120d1f"/>
    <rect x="96" y="330" width="320" height="14" rx="7" fill="#ff8a3d" opacity=".8"/>
    <rect x="146" y="370" width="220" height="12" rx="6" fill="#ff4f8b" opacity=".6"/>
    <rect x="196" y="406" width="120" height="10" rx="5" fill="#8b5cf6" opacity=".6"/>
  </g>
</svg>
